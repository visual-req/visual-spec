  <rect class="perimeter" x="40" y="96" width="2220" height="1232"/>

  <!-- ===== 图例与说明 ===== -->
  <line x1="40" y1="1348" x2="2260" y2="1348" stroke="#e2e8f0" stroke-width="1"/>
  <circle class="dotMain" cx="52" cy="1369" r="8"/>
  <text class="note" x="70" y="1374">核心覆盖：该关键功能点由对应列阶段的触发命令生成 / 交付</text>
  <circle class="dotSub" cx="52" cy="1397" r="8"/>
  <text class="note" x="70" y="1402">关联 / 同步影响：该阶段会同步波及此功能点产物（如 refine / upgrade 的级联更新）</text>
  <text class="note" x="2260" y="1402" text-anchor="end">列 1–8 = theory.md「阶段地图」8 阶段主链（含触发命令）；附加命令并入对应阶段列（more-q/refine-q/upgrade→需求结构化，i-test/append-test/script→实现输入），其余 mrd 在列 9；产物落于 /docs · /specs · /test，命令可组合、可迭代执行</text>
