  <line class="gridHdrSep" x1="1860" y1="96" x2="1860" y2="224"/>
  <line class="gridHdrSep" x1="2060" y1="96" x2="2060" y2="224"/>

  <!-- ===== 表格主体：每一行 = 一个关键功能点 ===== -->
  <text class="rowLabel" x="52" y="253">MRD 调研文档（市场 / 竞品 / 用户 / 产品设计 → /docs/market）</text>
  <circle class="dotMain" cx="2160" cy="248" r="9"/>

  <text class="rowLabel" x="52" y="301">业务上下文与目标补全（background / original.md）</text>
  <circle class="dotMain" cx="560" cy="296" r="9"/>

  <text class="rowLabel" x="52" y="349">干系人 · 角色 · 术语识别（stakeholders / roles / terms）</text>
  <circle class="dotMain" cx="560" cy="344" r="9"/>

  <text class="rowLabel" x="52" y="397">业务流程与泳道图建模（flows.puml）</text>
  <circle class="dotMain" cx="560" cy="392" r="9"/>

  <text class="rowLabel" x="52" y="445">场景枚举与场景级细节（前置 / 约束 / 变体 / 边界 / 对称性）</text>
  <circle class="dotMain" cx="560" cy="440" r="9"/>

  <text class="rowLabel" x="52" y="493">外部依赖分析与功能清单拆分（dependencies / functions.json）</text>
  <circle class="dotMain" cx="560" cy="488" r="9"/>

  <text class="rowLabel" x="52" y="541">待确认问题与问答闭环（questions + more-q 追加 / refine-q 合并）</text>
  <circle class="dotMain" cx="560" cy="536" r="9"/>

  <text class="rowLabel" x="52" y="589">数据模型（实体 / 字段 / 关系 / 枚举 / 状态机）</text>
  <circle class="dotMain" cx="760" cy="584" r="9"/>

  <text class="rowLabel" x="52" y="637">可运行原型与角色化页面（按 scheme.yaml 选栈）</text>
  <circle class="dotMain" cx="760" cy="632" r="9"/>

  <text class="rowLabel" x="52" y="685">场景评审入口与原型自检（scenario.html · 移动端 · 金额 · 可点击）</text>
  <circle class="dotMain" cx="760" cy="680" r="9"/>

  <text class="rowLabel" x="52" y="733">RBAC 与数据权限细化（页面 → 区域 → 控件；数据范围）</text>
  <circle class="dotMain" cx="960" cy="728" r="9"/>

  <text class="rowLabel" x="52" y="781">页面加载 · 交互 · 校验 · 提交后闭环</text>
  <circle class="dotMain" cx="960" cy="776" r="9"/>

  <text class="rowLabel" x="52" y="829">复杂规则可视化（决策/判定矩阵、时间轴、表达式树、编号、公式）</text>
  <circle class="dotMain" cx="960" cy="824" r="9"/>

  <text class="rowLabel" x="52" y="877">横切能力规格（缓存 / MQ / 导入导出 / 定时 / 通知 / 日志 / 认证 / 支付 / NFP）</text>
  <circle class="dotMain" cx="960" cy="872" r="9"/>

  <text class="rowLabel" x="52" y="925">服务逻辑与作业逻辑（状态机 / 幂等 / 补偿 / 重试 → 实现落地）</text>
  <circle class="dotMain" cx="960" cy="920" r="9"/>
  <circle class="dotSub" cx="1360" cy="920" r="9"/>

  <text class="rowLabel" x="52" y="973">细节阅读器（reader.html：目录树 + Markdown / PlantUML 渲染）</text>
  <circle class="dotMain" cx="960" cy="968" r="9"/>

  <text class="rowLabel" x="52" y="1021">验收用例（acceptance_cases.json + testcase_reader.html）</text>
  <circle class="dotMain" cx="1160" cy="1016" r="9"/>

  <text class="rowLabel" x="52" y="1069">前后端集成实现（后端核心 API + 前端页面联调）</text>
  <circle class="dotMain" cx="1360" cy="1064" r="9"/>

  <text class="rowLabel" x="52" y="1117">质量检查报告（qc_report：遗漏 / 矛盾 / 不可测问题清单）</text>
  <circle class="dotMain" cx="1560" cy="1112" r="9"/>

  <text class="rowLabel" x="52" y="1165">变更同步与修订（refine 归因变更并同步下游产物）</text>
  <circle class="dotMain" cx="1760" cy="1160" r="9"/>
  <circle class="dotSub" cx="560" cy="1160" r="9"/>
  <circle class="dotSub" cx="760" cy="1160" r="9"/>
  <circle class="dotSub" cx="960" cy="1160" r="9"/>

  <text class="rowLabel" x="52" y="1213">需求估算与排期（用户故事地图 + 排期 HTML）</text>
  <circle class="dotMain" cx="1960" cy="1208" r="9"/>

  <text class="rowLabel" x="52" y="1261">单元/集成用例与自动化测试代码（i-test JSON · script · append-test）</text>
  <circle class="dotMain" cx="1360" cy="1256" r="9"/>
  <circle class="dotSub" cx="1160" cy="1256" r="9"/>

  <text class="rowLabel" x="52" y="1309">升级重构（upgrade 基于 /docs/legacy · /docs/current 重建 /specs/）</text>
  <circle class="dotMain" cx="560" cy="1304" r="9"/>

