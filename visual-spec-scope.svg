<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="1430" viewBox="0 0 2320 1430">
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b4fd8"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .hdrName { font: 800 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .hdrCmd { font: 10.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: rgba(255, 255, 255, 0.9); }
      .hdrCmdS { font: 9px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: rgba(255, 255, 255, 0.92); }
      .hdrLabel { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .hdrSub { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: rgba(255, 255, 255, 0.8); }
      .rowLabel { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .dotMain { fill: #2563eb; }
      .dotSub { fill: none; stroke: #60a5fa; stroke-width: 2.5; }
      .gridV { stroke: #e2e8f0; stroke-width: 1; }
      .gridVLabel { stroke: #cbd5e1; stroke-width: 1.2; }
      .gridH { stroke: #eef2f7; stroke-width: 1; }
      .gridHdrSep { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; }
      .perimeter { fill: none; stroke: #94a3b8; stroke-width: 1.6; }
      .note { font: 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2320" height="1430"/>

  <text class="title" x="40" y="46">visual-spec 覆盖范围 · 工程阶段 × 关键功能点</text>
  <text class="subtitle" x="40" y="74">以「场景为主线、/vspec:* 命令分阶段驱动」。表头第 1–8 列 = docs/zh-CN/theory.md「阶段地图」的 8 个工程阶段（粗体为阶段触发命令，同列小字为并入该阶段的关联附加命令），第 9 列 = 其余附加命令；下方表格每一行对应一个关键功能点。</text>

  <!-- ===== 表头（第一行）= 工程阶段步骤 ===== -->
  <rect x="40" y="96" width="2220" height="128" fill="url(#hdrGrad)"/>
  <text class="hdrLabel" x="250" y="152" text-anchor="middle">关键功能点</text>
  <text class="hdrSub" x="250" y="176" text-anchor="middle">（表格行）</text>

  <text class="hdrName" x="560" y="142" text-anchor="middle">1 需求结构化</text>
  <text class="hdrCmd" x="560" y="168" text-anchor="middle">/vspec:new</text>
  <text class="hdrCmdS" x="560" y="194" text-anchor="middle">/vspec:more-q · refine-q · upgrade</text>

  <text class="hdrName" x="760" y="142" text-anchor="middle">2 方案验证</text>
  <text class="hdrCmd" x="760" y="182" text-anchor="middle">/vspec:verify</text>

  <text class="hdrName" x="960" y="142" text-anchor="middle">3 规格细化</text>
  <text class="hdrCmd" x="960" y="182" text-anchor="middle">/vspec:detail</text>

  <text class="hdrName" x="1160" y="142" text-anchor="middle">4 验收与测试</text>
  <text class="hdrCmd" x="1160" y="182" text-anchor="middle">/vspec:accept</text>

  <text class="hdrName" x="1360" y="142" text-anchor="middle">5 实现输入</text>
  <text class="hdrCmd" x="1360" y="160" text-anchor="middle">/vspec:impl</text>
  <text class="hdrCmdS" x="1360" y="182" text-anchor="middle">/vspec:i-test · append-test · script</text>

  <text class="hdrName" x="1560" y="142" text-anchor="middle">6 质量检查</text>
  <text class="hdrCmd" x="1560" y="182" text-anchor="middle">/vspec:qc</text>

  <text class="hdrName" x="1760" y="142" text-anchor="middle">7 变更同步</text>
  <text class="hdrCmd" x="1760" y="182" text-anchor="middle">/vspec:refine</text>

  <text class="hdrName" x="1960" y="142" text-anchor="middle">8 估算与排期</text>
  <text class="hdrCmd" x="1960" y="182" text-anchor="middle">/vspec:plan</text>

  <text class="hdrName" x="2160" y="142" text-anchor="middle">9 附加命令</text>
  <text class="hdrCmd" x="2160" y="182" text-anchor="middle">/vspec:mrd</text>

  <line class="gridHdrSep" x1="460" y1="96" x2="460" y2="224"/>
  <line class="gridHdrSep" x1="660" y1="96" x2="660" y2="224"/>
  <line class="gridHdrSep" x1="860" y1="96" x2="860" y2="224"/>
  <line class="gridHdrSep" x1="1060" y1="96" x2="1060" y2="224"/>
  <line class="gridHdrSep" x1="1260" y1="96" x2="1260" y2="224"/>
  <line class="gridHdrSep" x1="1460" y1="96" x2="1460" y2="224"/>
